# Pao AI Gateway — Model Catalog
# Pricing: null = unknown (fail-closed for budget admission).
# Never interpret unknown price as free.

models:
  openai-code-primary:
    provider: openai-main
    model: gpt-4o
    capabilities:
      chat: true
      tools: true
      structured_output: true
      vision: true
      reasoning: true
    limits:
      context_window: 128000
      max_output_tokens: 16384
    pricing:
      input_per_million_usd: 2.50
      output_per_million_usd: 10.00
      cached_input_per_million_usd: 1.25
    tags:
      - coding
      - reasoning
      - vision

  openai-fast:
    provider: openai-main
    model: gpt-4o-mini
    capabilities:
      chat: true
      tools: true
      structured_output: true
      vision: true
      reasoning: false
    limits:
      context_window: 128000
      max_output_tokens: 16384
    pricing:
      input_per_million_usd: 0.15
      output_per_million_usd: 0.60
      cached_input_per_million_usd: 0.075
    tags:
      - fast
      - cheap

  anthropic-code-secondary:
    provider: anthropic-main
    model: claude-sonnet-4-20250514
    capabilities:
      chat: true
      tools: true
      structured_output: true
      vision: true
      reasoning: true
    limits:
      context_window: 200000
      max_output_tokens: 8192
    pricing:
      input_per_million_usd: 3.00
      output_per_million_usd: 15.00
      cached_input_per_million_usd: 0.30
    tags:
      - coding
      - reasoning
      - review

  anthropic-review:
    provider: anthropic-main
    model: claude-opus-4-20250514
    capabilities:
      chat: true
      tools: true
      structured_output: true
      vision: true
      reasoning: true
    limits:
      context_window: 200000
      max_output_tokens: 32000
    pricing:
      input_per_million_usd: 15.00
      output_per_million_usd: 75.00
      cached_input_per_million_usd: 1.50
    tags:
      - review
      - reasoning
      - critical

  gemini-vision:
    provider: gemini-main
    model: gemini-2.0-flash
    capabilities:
      chat: true
      tools: true
      structured_output: true
      vision: true
      reasoning: false
    limits:
      context_window: 1048576
      max_output_tokens: 8192
    pricing:
      input_per_million_usd: 0.10
      output_per_million_usd: 0.40
    tags:
      - vision
      - fast
      - cheap

  local-fast:
    provider: local-vllm
    model: ${PAO_LOCAL_FAST_MODEL}
    capabilities:
      chat: true
      tools: false
      structured_output: true
      vision: false
      reasoning: false
    limits:
      context_window: null
      max_output_tokens: null
    pricing:
      input_per_million_usd: 0
      output_per_million_usd: 0
    tags:
      - local
      - fast
      - cheap
      - private
