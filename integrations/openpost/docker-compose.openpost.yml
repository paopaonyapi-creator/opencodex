services:
  openpost:
    # Pinned release tag — never `latest` in production. Bump deliberately and
    # re-run the Pao-hubPro integration smoke test after upgrades.
    image: ghcr.io/getopenpost/openpost:v4.33.0
    platform: linux/amd64
    container_name: openpost
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      OPENPOST_PORT: 8080
      OPENPOST_DATABASE_PATH: /data/db/openpost.db
      OPENPOST_MEDIA_PATH: /data/media
