# Isolated AnythingMCP evaluation stack for Phase 20.96 live validation.
# References the official published image only — AGPL source is not vendored.
# Bind loopback only. Do not publish this compose to a public interface.

name: ${COMPOSE_PROJECT_NAME:-pao-amcp-2096}

services:
  app:
    image: helpcodeai/anythingmcp:latest
    platform: linux/amd64
    container_name: ${COMPOSE_PROJECT_NAME:-pao-amcp-2096}-app
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-13000}:3000"
      - "127.0.0.1:${BACKEND_PORT:-14000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:${BACKEND_PORT:-14000}
      - DATABASE_URL=postgresql://amcp:${POSTGRES_PASSWORD:-amcp}@postgres:5432/anythingmcp
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      - CORS_ORIGIN=http://127.0.0.1:${FRONTEND_PORT:-13000}
      - SERVER_URL=http://127.0.0.1:${BACKEND_PORT:-14000}
      - FRONTEND_URL=http://127.0.0.1:${FRONTEND_PORT:-13000}
      - MCP_AUTH_MODE=legacy
      - MCP_ALLOW_ANONYMOUS=false
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN:?set MCP_BEARER_TOKEN in .env}
      - MCP_STREAMABLE_JSON_RESPONSE=true
      - ALLOW_OPEN_REGISTRATION=false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-pao-amcp-2096}-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=amcp
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-amcp}
      - POSTGRES_DB=anythingmcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amcp -d anythingmcp"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
